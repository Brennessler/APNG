<!doctype html>
<html lang="en">

<head>
  <!--
    JavaScript Snake
    Original project: https://github.com/patorjk/JavaScript-Snake
    MIT License
  -->

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Christmas Snake</title>

  <link
    rel="preload"
    href="css/tuicss/fonts/perfect-dos-vga-437.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  />

  <link
    rel="stylesheet"
    type="text/css"
    href="css/tuicss/tuicss.min.css"
  />

  <link
    rel="stylesheet"
    type="text/css"
    href="css/common-snake.css"
  />

  <link
    rel="stylesheet"
    type="text/css"
    href="css/dos-snake.css"
  />

  <link
    rel="stylesheet"
    type="text/css"
    href="css/main-snake.css"
  />

  <link
    rel="shortcut icon"
    href="css/images/favicon.png"
  />

  <link
    rel="stylesheet"
    type="text/css"
    href="css/calendar-snake.css"
  />

</head>

<body>

  <div
    class="snake-dialog-controls"
    id="snake-dialog-controls"
  >

    <div class="snake-control-row">

      <label for="selectMode">
        Mode:
      </label>

      <select
        id="selectMode"
        class="tui-input"
      >
        <option value="100">
          Easy
        </option>

        <option
          value="75"
          selected
        >
          Medium
        </option>

        <option value="50">
          Hard
        </option>

        <option value="25">
          Impossible
        </option>

        <option value="110">
          Rush
        </option>

      </select>

    </div>

  </div>


  <!-- Snake game -->

  <div
    id="game-area"
    tabindex="0"
  ></div>


  <!--
    Touch controls.
    Only displayed on devices with coarse pointer input.
    Wiring is handled by js/init.js.
  -->

  <div
    class="snake-gamepad"
    id="snake-gamepad"
  >

    <button
      data-key="38"
      style="grid-area: 1 / 2"
      aria-label="Up"
    >
      ▲
    </button>

    <button
      data-key="37"
      style="grid-area: 2 / 1"
      aria-label="Left"
    >
      ◀
    </button>

    <button
      data-key="32"
      style="grid-area: 2 / 2"
      aria-label="Pause"
    >
      ❚❚
    </button>

    <button
      data-key="39"
      style="grid-area: 2 / 3"
      aria-label="Right"
    >
      ▶
    </button>

    <button
      data-key="40"
      style="grid-area: 3 / 2"
      aria-label="Down"
    >
      ▼
    </button>

  </div>


  <!-- Original Snake engine -->

  <script
    type="text/javascript"
    src="js/snake.js"
  ></script>

  <!-- Game configuration -->

  <script
    type="text/javascript"
    src="js/init.js"
  ></script>

</body>

</html>
