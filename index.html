<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17111f">
  <title>Kassan — 1 kr</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #efe5cb;
      --paper-dark: #d3c4a0;
      --plastic: #b9b8ae;
      --plastic-dark: #85847d;
      --ink: #211f1a;
      --ink-soft: #555146;
      --black: #171715;
      --red: #982c24;
      --blue: #344f63;
      --yellow: #f0d454;
      --line: #292721;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    body {
      min-width: 280px;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #171715;
      color: var(--ink);
      font: 12px/1.3 Arial, Helvetica, sans-serif;
    }

    button { font: inherit; }

    .store {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      gap: clamp(4px, .8vh, 8px);
      width: 100%;
      max-width: 1280px;
      height: 100%;
      margin: 0 auto;
      padding: clamp(6px, 1vw, 12px);
      background: #393833;
    }

    .store-header,
    .ledger,
    .counter-panel,
    .shop-panel,
    .achievement {
      border: 2px solid var(--line);
      box-shadow: inset 1px 1px #fff8e4, inset -1px -1px #898474;
    }

    .store-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 34px;
      padding: 3px 7px;
      background: var(--paper);
    }

    .brand {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 7px;
    }

    .brand-stamp {
      flex: 0 0 auto;
      padding: 4px 7px;
      background: var(--red);
      color: #fff4d8;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      transform: rotate(-1deg);
    }

    .store-name { min-width: 0; }

    h1 {
      margin: 0;
      font-size: clamp(13px, 2.2vw, 19px);
      line-height: 1.05;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .tagline {
      display: block;
      margin-top: 2px;
      color: var(--ink-soft);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .7px;
    }

    .header-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 6px;
    }

    .open-sign {
      padding: 3px 5px;
      border: 1px solid var(--red);
      color: var(--red);
      font-size: 9px;
      font-weight: 800;
      white-space: nowrap;
    }

    .small-button {
      min-height: 25px;
      padding: 3px 7px;
      border: 1px solid #171613;
      border-radius: 0;
      background: var(--plastic);
      box-shadow: inset 1px 1px #f4f0e3, inset -1px -1px #77766f;
      color: var(--ink);
      font-size: 9px;
      font-weight: 800;
      cursor: pointer;
    }

    .small-button:hover { background: #d0cfc4; }

    button:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 2px;
    }

    .ledger {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 45px;
      background: var(--paper);
    }

    .ledger-cell {
      display: grid;
      align-content: center;
      min-width: 0;
      padding: 3px 8px;
    }

    .ledger-cell + .ledger-cell { border-left: 1px dashed #91866d; }

    .ledger-label {
      color: var(--ink-soft);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .ledger-value {
      overflow: hidden;
      font-size: clamp(17px, 3.2vw, 25px);
      font-weight: 900;
      line-height: 1.05;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #rateValue { color: #344f39; }

    .legacy-note {
      color: var(--ink-soft);
      font-size: 8px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(130px, .78fr) minmax(205px, 1.22fr);
      gap: clamp(5px, .8vw, 10px);
      min-height: 0;
    }

    .counter-panel,
    .shop-panel {
      min-width: 0;
      min-height: 0;
      background: var(--plastic);
    }

    .counter-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      padding: 6px;
      background: #c4c2b7;
    }

    .counter-heading {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      color: #3a3832;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .8px;
    }

    .yellow-sticker {
      padding: 2px 4px;
      border: 1px solid #4a3e18;
      background: var(--yellow);
      color: #241e0e;
      font-size: 8px;
      letter-spacing: .2px;
      transform: rotate(1deg);
    }

    .coin-stage {
      position: relative;
      display: grid;
      flex: 1 1 auto;
      place-items: center;
      width: 100%;
      min-height: 0;
    }

    .coin {
      display: block;
      width: min(230px, 36vh, 38vw);
      max-width: 100%;
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .coin img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(2px 4px 1px rgba(0, 0, 0, .42));
      transform-origin: center;
    }

    .coin:hover img { filter: drop-shadow(3px 5px 1px rgba(0, 0, 0, .45)); }
    .coin:active img { transform: scale(.94); }
    .coin.tapped img { animation: coin-tap .17s ease-out; }

    @keyframes coin-tap {
      0% { transform: scale(1) rotate(0); }
      38% { transform: translateY(3px) scale(.91) rotate(var(--coin-turn, 3deg)); }
      100% { transform: scale(1) rotate(0); }
    }

    .click-effects {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .click-float {
      position: absolute;
      color: #304835;
      font-size: 14px;
      font-weight: 900;
      text-shadow: 1px 1px #fff8df;
      white-space: nowrap;
      animation: float-up .72s ease-out forwards;
    }

    @keyframes float-up {
      from { opacity: 1; transform: translate(-50%, -20%); }
      to { opacity: 0; transform: translate(-50%, -42px); }
    }

    .click-caption {
      display: grid;
      gap: 2px;
      width: 100%;
      padding: 4px 2px;
      border-top: 1px dashed #77766c;
      text-align: center;
    }

    .click-caption strong { font-size: 12px; }
    .click-caption small { color: var(--ink-soft); font-size: 9px; }

    .turnover {
      display: flex;
      width: 100%;
      justify-content: space-between;
      gap: 4px;
      padding-top: 4px;
      color: var(--ink-soft);
      font-size: 9px;
    }

    .turnover strong { color: var(--ink); }

    .shop-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 5px;
    }

    .shop-heading {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
      padding: 4px 6px;
      border: 1px solid #292721;
      background: #34332f;
      color: var(--paper);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .8px;
    }

    .shop-heading small {
      color: var(--yellow);
      font-size: 8px;
      letter-spacing: .3px;
    }

    .upgrade-list {
      display: grid;
      flex: 1 1 auto;
      align-content: start;
      gap: 4px;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 1px 3px 3px 1px;
      overscroll-behavior: contain;
      scrollbar-color: #6b695f #aaa89e;
      scrollbar-width: thin;
    }

    .upgrade {
      display: grid;
      grid-template-areas: "title buy" "effect price" "lock lock";
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 2px 6px;
      min-height: 45px;
      padding: 4px 6px;
      border: 1px solid #35332d;
      border-radius: 0;
      background: var(--paper);
      box-shadow: inset 1px 1px #fff9e7, inset -1px -1px #c5b794;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .upgrade:not(:disabled):hover {
      background: #f7edcf;
      border-color: var(--red);
    }

    .upgrade:disabled { cursor: not-allowed; }

    .upgrade-title {
      display: flex;
      grid-area: title;
      min-width: 0;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }

    .upgrade-icon { flex: 0 0 auto; font-size: 14px; }
    .upgrade-name { overflow: hidden; font-weight: 800; text-overflow: ellipsis; }
    .upgrade-count { flex: 0 0 auto; color: var(--ink-soft); font-size: 8px; }
    .upgrade-effect { grid-area: effect; color: #344f39; font-size: 10px; font-weight: 800; }
    .upgrade-price { grid-area: price; color: #37342e; font-size: 9px; text-align: right; white-space: nowrap; }

    .netflix-panel {
      flex: 0 0 auto;
      margin-top: 5px;
      padding: 6px;
      border: 3px double #711b18;
      background: #a9362d;
      color: #fff1c5;
      box-shadow: 2px 2px 0 #292721;
    }

    .netflix-heading {
      margin: 0 0 2px;
      color: var(--yellow);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .6px;
    }

    .netflix-description,
    .netflix-price { margin: 2px 0; font-size: 9px; }
    .netflix-price { font-weight: 900; }

    .netflix-buy {
      min-height: 25px;
      margin-top: 3px;
      padding: 3px 8px;
      border: 2px solid #30220d;
      border-radius: 0;
      background: var(--yellow);
      color: #211b0d;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
    }

    .netflix-buy:disabled { background: #c6bda1; color: #4b4534; cursor: default; }
    .netflix-status { margin: 3px 0 0; font-size: 10px; font-weight: 900; }

    .achievement-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
    }

    .achievement {
      min-width: 0;
      padding: 3px 5px;
      overflow: hidden;
      background: #d0cfc4;
      color: #575449;
      font-size: 8px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .achievement.unlocked {
      border-color: #596444;
      background: #e2dfbd;
      color: #34452e;
    }

    .footer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
      min-height: 25px;
      color: #e6dfc9;
      font-size: 8px;
    }

    #saveStatus,
    #message {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #message { color: var(--yellow); text-align: center; }
    .footer-actions { display: flex; justify-content: flex-end; }

    @media (max-width: 520px) {
      .store { padding: 5px; }
      .store-header { min-height: 30px; padding: 2px 5px; }
      .layout { grid-template-columns: minmax(120px, .78fr) minmax(190px, 1.22fr); gap: 4px; }
      .counter-panel { padding: 4px; }
      .shop-panel { padding: 3px; }
      .upgrade-list { gap: 3px; }
      .upgrade { padding: 3px 4px; }
      .achievement-strip { gap: 2px; }
      .achievement { padding: 2px 3px; font-size: 7px; }
      .footer { gap: 3px; font-size: 7px; }
    }

    @media (max-width: 420px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(118px, .65fr) minmax(100px, 1fr);
      }

      .counter-panel { padding: 3px 6px; }
      .coin { width: min(118px, 30vw); }
      .counter-heading { font-size: 8px; }
      .yellow-sticker { font-size: 7px; }
      .click-caption { padding: 2px; }
      .click-caption small { display: none; }
      .turnover { padding-top: 2px; }
    }

    @media (max-height: 420px) {
      .store { gap: 4px; padding: 5px; }
      .store-header { min-height: 27px; }
      .ledger { min-height: 38px; }
      .counter-panel { padding: 3px; }
      .shop-panel { padding: 3px; }
      .upgrade { min-height: 39px; }
      .achievement { padding-top: 2px; padding-bottom: 2px; }
      .footer { min-height: 19px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    :root {
      --paper: #f7e9d4;
      --paper-dark: #d7bb9c;
      --plastic: #241a30;
      --plastic-dark: #17111f;
      --ink: #fff0dd;
      --ink-soft: #d0b8c5;
      --black: #120d19;
      --red: #ef648b;
      --blue: #79cbd0;
      --yellow: #ffd879;
      --line: #573952;
    }

    body {
      background: #100c17;
      color: var(--ink);
      font-size: 14px;
    }

    .store {
      grid-template-rows: auto minmax(0, 1fr);
      gap: 9px;
      padding: clamp(18px, 5vh, 28px) clamp(28px, 6vw, 44px);
      background: #17111f;
    }

    .ledger {
      min-height: 64px;
      border: 1px solid #74455f;
      background: #21182c;
      box-shadow: inset 0 0 18px rgba(236, 83, 143, .08), 0 0 12px rgba(236, 83, 143, .12);
    }

    .ledger-cell { padding: 6px 12px; }
    .ledger-cell + .ledger-cell { border-left: 1px solid #68455f; }

    .ledger-label {
      color: #d5a5bf;
      font-size: 11px;
      letter-spacing: 1.4px;
    }

    .ledger-value {
      color: #fff0dd;
      font-size: clamp(22px, 4.5vw, 34px);
      text-shadow: 0 0 10px rgba(255, 216, 121, .18);
    }

    #rateValue { color: #9de0c8; }
    .legacy-note { color: #c9b5c7; font-size: 10px; }

    .layout {
      grid-template-columns: minmax(140px, .68fr) minmax(250px, 1.32fr);
      gap: clamp(7px, 1vw, 12px);
    }

    .counter-panel,
    .shop-panel {
      border: 1px solid #68445f;
      box-shadow: inset 0 0 20px rgba(203, 73, 132, .08), 0 0 10px rgba(63, 39, 86, .35);
      background: #241a30;
    }

    .counter-panel { padding: 9px; }

    .counter-heading {
      color: #f2d2df;
      font-size: 12px;
      letter-spacing: 1.3px;
    }

    .yellow-sticker {
      padding: 3px 6px;
      border: 1px solid #bd8f42;
      background: #563a44;
      color: #ffdf9a;
      font-size: 9px;
      transform: rotate(-1deg);
    }

    .coin {
      width: min(300px, 100%, 62vh, 42vw);
      max-height: 100%;
    }

    .coin img {
      filter: drop-shadow(0 0 9px rgba(255, 203, 105, .24)) drop-shadow(3px 5px 2px rgba(0, 0, 0, .55));
    }

    .coin:hover img {
      filter: drop-shadow(0 0 13px rgba(255, 203, 105, .4)) drop-shadow(3px 5px 2px rgba(0, 0, 0, .58));
    }

    .click-float {
      color: #a8eed3;
      font-size: 17px;
      text-shadow: 0 0 7px rgba(90, 229, 194, .55), 1px 1px #17111f;
    }

    .click-caption {
      gap: 4px;
      padding: 7px 3px;
      border-top: 1px solid #674660;
    }

    .click-caption strong { color: #ffdc91; font-size: 16px; }
    .click-caption small { color: #d0b8c5; font-size: 11px; }

    .turnover {
      padding-top: 5px;
      color: #d0b8c5;
      font-size: 11px;
    }

    .turnover strong { color: #fff0dd; }

    .shop-panel {
      padding: 7px;
      background: #1d1728;
    }

    .shop-heading {
      min-height: 34px;
      margin-bottom: 6px;
      padding: 4px 8px;
      border: 1px solid #bd5079;
      background: #48253f;
      color: #ffe6d8;
      font-size: 12px;
      letter-spacing: 1.1px;
      box-shadow: inset 0 0 12px rgba(239, 100, 139, .12), 0 0 8px rgba(239, 100, 139, .16);
    }

    .shop-heading small { color: #ffd879; font-size: 9px; }

    .reset-button {
      min-width: 29px;
      min-height: 25px;
      padding: 2px 6px;
      border: 1px solid #b45c83;
      border-radius: 0;
      background: #2b1d32;
      color: #ffd9df;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .reset-button:hover { background: #60304c; }

    .upgrade-list {
      gap: 6px;
      padding: 4px 5px 10px 2px;
      scroll-padding-block: 4px;
      scroll-snap-type: y proximity;
    }

    .upgrade {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 5px;
      min-height: 72px;
      padding: 7px 8px;
      border: 1px solid #61486d;
      background: #2a2237;
      box-shadow: inset 0 0 9px rgba(133, 87, 164, .08);
      color: #f5e4d7;
      scroll-snap-align: start;
    }

    .upgrade:not(:disabled):hover {
      border-color: #e875a2;
      background: #392641;
      box-shadow: inset 0 0 12px rgba(232, 117, 162, .12), 0 0 7px rgba(232, 117, 162, .16);
    }

    .upgrade.affordable {
      border-color: #a85b82;
      background: #32253d;
      box-shadow: inset 0 0 14px rgba(232, 117, 162, .12), 0 0 8px rgba(232, 117, 162, .2);
    }

    .upgrade:disabled { background: #25202f; color: #c2b5c8; }
    .upgrade.locked {
      border-color: #6b6870;
      background: #4a4850;
      box-shadow: inset 0 0 9px rgba(0, 0, 0, .3);
      filter: grayscale(1);
    }

    .upgrade.locked > * { visibility: hidden; }
    .upgrade-title {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      width: 100%;
      min-width: 0;
      font-size: 13px;
    }

    .upgrade-icon { flex: 0 0 auto; font-size: 17px; }
    .upgrade-name {
      flex: 1 1 auto;
      min-width: 0;
      overflow: visible;
      color: #fff0dd;
      line-height: 1.2;
      text-overflow: clip;
      white-space: normal;
      word-break: normal;
    }

    .upgrade-count { flex: 0 0 auto; color: #c7a6c8; font-size: 10px; }

    .upgrade-details {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 2px 8px;
      min-width: 0;
    }

    .upgrade-effect { color: #9de0c8; font-size: 12px; white-space: nowrap; }
    .upgrade-price { color: #f4d7ab; font-size: 11px; text-align: right; white-space: normal; }

    .netflix-panel {
      margin-top: 7px;
      padding: 9px;
      border: 2px solid #f277ab;
      background: #431d42;
      color: #fff0dd;
      box-shadow: 0 0 16px rgba(242, 87, 168, .28), inset 0 0 17px rgba(111, 95, 235, .15);
    }

    .netflix-heading {
      color: #ffd879;
      font-size: 18px;
      text-shadow: 0 0 8px rgba(255, 216, 121, .4);
    }

    .netflix-description,
    .netflix-price { font-size: 12px; }

    .netflix-buy {
      min-height: 32px;
      padding: 5px 10px;
      border: 1px solid #ffe6a1;
      background: #d95489;
      color: #fff5df;
      font-size: 12px;
      box-shadow: 0 0 9px rgba(245, 103, 172, .3);
    }

    .netflix-buy:disabled { background: #63516a; color: #eee0d5; }
    .netflix-status { font-size: 12px; color: #9de0c8; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 520px) {
      .store { padding: 14px clamp(24px, 5vw, 36px); gap: 6px; }
      .ledger { min-height: 58px; }
      .ledger-cell { padding: 5px 8px; }
      .layout { grid-template-columns: minmax(130px, .68fr) minmax(245px, 1.32fr); gap: 5px; }
      .counter-panel { padding: 6px; }
      .shop-panel { padding: 4px; }
      .shop-heading small { display: none; }
      .upgrade-list { gap: 5px; }
      .upgrade { min-height: 70px; padding: 6px; }
      .upgrade-title { font-size: 12px; }
      .upgrade-effect { font-size: 11px; }
      .upgrade-price { font-size: 10px; }
    }

    @media (max-width: 420px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(125px, .65fr) minmax(100px, 1fr);
      }

      .coin { width: min(155px, 100%, 36vw); }
      .click-caption { padding: 4px 2px; }
      .click-caption small { display: block; }
    }

    @media (max-height: 420px) {
      .store { gap: 4px; padding: 14px clamp(30px, 6vw, 42px); }
      .ledger { min-height: 50px; }
      .counter-panel { padding: 4px; }
      .shop-panel { padding: 4px; }
      .coin { width: min(245px, 100%, 58vh, 40vw); }
      .upgrade-list { gap: 3px; }
      .upgrade { min-height: 64px; }
    }
  </style>
</head>
<body>
  <main class="store" id="store" tabindex="-1">
    <section class="ledger" aria-label="Butikens ekonomi">
      <div class="ledger-cell">
        <span class="ledger-label">KRONOR</span>
        <strong class="ledger-value" id="scoreValue">0 kr</strong>
      </div>
      <div class="ledger-cell">
        <span class="ledger-label">PASSIV INKOMST</span>
        <strong class="ledger-value" id="rateValue">+0 kr/s</strong>
        <small class="legacy-note" id="legacyIncomeNote" hidden></small>
      </div>
    </section>

    <div class="layout">
      <section class="counter-panel" aria-label="Kassa">
        <div class="counter-heading">
          <span>1-KRONA</span>
          <span class="yellow-sticker">TRYCK FÖR KÖP</span>
        </div>
        <div class="coin-stage" id="coinStage">
          <button class="coin" id="coin" type="button" aria-label="Tjäna 1 krona">
            <img id="coinImage" src="assets/coin.png" alt="">
          </button>
          <div class="click-effects" id="clickEffects" aria-hidden="true"></div>
        </div>
        <div class="click-caption">
          <strong id="clickValue">1 kr/klick</strong>
          <small>Kassan tar kontant.</small>
        </div>
        <div class="turnover">
          <span>Omsättning totalt</span>
          <strong id="earnedValue">0 kr</strong>
        </div>
      </section>

      <section class="shop-panel" aria-label="Butikens investeringar">
        <div class="shop-heading">
          <span>BAKOM KASSAN</span>
          <small>PRISLISTA • 1995</small>
          <button id="reset" class="reset-button" type="button" aria-label="Nollställ spel" title="Nollställ spel">↻</button>
        </div>
        <div class="upgrade-list" id="upgradeList"></div>
        <section class="netflix-panel" id="netflixPanel" aria-label="Slutmål" hidden>
          <h2 class="netflix-heading">📡 KÖP NETFLIX</h2>
          <p class="netflix-description" id="netflixDescription">Hela verksamheten. Kontant betalning.</p>
          <p class="netflix-price" id="netflixPrice"></p>
          <button class="netflix-buy" id="netflixBuy" type="button">KÖP NETFLIX</button>
          <p class="netflix-status" id="netflixStatus" hidden></p>
        </section>
      </section>
    </div>

    <div hidden aria-hidden="true">
      <div id="achievement1"></div>
      <div id="achievement2"></div>
      <div id="achievement3"></div>
    </div>
    <span id="saveStatus" class="visually-hidden" role="status"></span>
  </main>

  <script>
    'use strict';

    const SAVE_KEY = 'winniegaming-cookie-clicker-v1';
    const SAVE_VERSION = 2;
    const LIMIT = 1e100;
    const MAX_PURCHASES = 1000000;
    const NETFLIX_COST = 1e15;
    const numberFormat = new Intl.NumberFormat('sv-SE', { maximumFractionDigits: 0 });
    const upgrades = [
      { icon: '🍬', name: 'Jenkatuggummi', effect: 1, kind: 'click', baseCost: 25, growth: 1.55 },
      { icon: '🍬', name: 'Stelt lösgodis', effect: 2, kind: 'passive', baseCost: 80, growth: 1.6 },
      { icon: '🥤', name: 'Avslagen julmust', effect: 5, kind: 'passive', baseCost: 275, growth: 1.65 },
      { icon: '📼', name: 'Förseningsavgifter', effect: 15, kind: 'passive', baseCost: 1200, growth: 1.7 },
      { icon: '👨‍💼', name: 'Timanställd gymnasieelev', effect: 50, kind: 'passive', baseCost: 6000, growth: 1.75 },
      { icon: '🔴', name: 'Det röda skynket', effect: 100, kind: 'passive', baseCost: 32000, growth: 1.8 },
      { icon: '☎️', name: 'Automatiska hotfulla påminnelsesamtal', effect: 500, kind: 'passive', baseCost: 175000, growth: 1.85 },
      { icon: '🎬', name: 'Videobutik 2: The Sequel', effect: 2000, kind: 'passive', baseCost: 1100000, growth: 1.9 },
      { icon: '📼', name: 'Systembolaget, fast VHS', effect: 25000, kind: 'passive', baseCost: 9000000, growth: 1.95 },
      { icon: '🌍', name: 'Global VHS-dominans', effect: 1000000, kind: 'passive', baseCost: 125000000, growth: 2 },
      { icon: '🕳️', name: 'Videobutik utanför tid och rum', effect: 1000000000, kind: 'passive', baseCost: 8000000000, growth: 2.1 }
    ];
    const achievementNames = [
      'Första hundralappen',
      'Fem inköp i liggaren',
      'Automatisk omsättning'
    ];
    const defaults = () => ({
      version: SAVE_VERSION,
      score: 0,
      earned: 0,
      upgrades: Array(upgrades.length).fill(0),
      legacyIncome: 0,
      achievements: Array(achievementNames.length).fill(false),
      netflix: false
    });

    let state = defaults();
    let storageAvailable = true;
    let dirty = false;
    const el = id => document.getElementById(id);
    const coin = el('coin');
    const coinStage = el('coinStage');
    const upgradeList = el('upgradeList');

    function format(value) {
      return numberFormat.format(Math.floor(Math.max(0, value)));
    }

    function kronor(value) {
      return `${format(value)} kr`;
    }

    function clickValue() {
      return 1 + state.upgrades[0];
    }

    function passiveIncome() {
      return Math.min(LIMIT, upgrades.reduce((total, upgrade, index) => {
        return total + (upgrade.kind === 'passive' ? upgrade.effect * state.upgrades[index] : 0);
      }, state.legacyIncome));
    }

    function upgradeCost(index) {
      const upgrade = upgrades[index];
      return Math.min(LIMIT, Math.ceil(upgrade.baseCost * Math.pow(upgrade.growth, state.upgrades[index])));
    }

    function isUnlocked(index) {
      return index === 0 || state.upgrades[index - 1] > 0;
    }

    function netflixUnlocked() {
      return state.upgrades.every(count => count > 0);
    }

    function validNumber(value) {
      return Number.isFinite(value) && value >= 0 && value <= LIMIT;
    }

    function validCurrentSave(saved) {
      return saved && saved.version === SAVE_VERSION &&
        validNumber(saved.score) && validNumber(saved.earned) &&
        validNumber(saved.legacyIncome) &&
        Array.isArray(saved.upgrades) && saved.upgrades.length === upgrades.length &&
        saved.upgrades.every(count => Number.isInteger(count) && count >= 0 && count <= MAX_PURCHASES) &&
        Array.isArray(saved.achievements) && saved.achievements.length === achievementNames.length &&
        saved.achievements.every(value => typeof value === 'boolean') &&
        typeof saved.netflix === 'boolean';
    }

    function validLegacySave(saved) {
      return saved && saved.version === 1 &&
        validNumber(saved.score) && validNumber(saved.earned) &&
        ['small', 'large', 'auto'].every(key => Number.isInteger(saved[key]) && saved[key] >= 0 && saved[key] <= 10000) &&
        Array.isArray(saved.achievements) && saved.achievements.length === 3 &&
        saved.achievements.every(value => typeof value === 'boolean');
    }

    function migrateLegacySave(saved) {
      const migrated = defaults();
      const oldClickValue = 1 + 2 * saved.small + 4 * saved.large;
      migrated.score = saved.score;
      migrated.earned = Math.max(saved.score, saved.earned);
      migrated.upgrades[0] = Math.min(MAX_PURCHASES, 2 * saved.small + 4 * saved.large);
      migrated.legacyIncome = Math.min(LIMIT, saved.auto * oldClickValue);
      migrated.achievements = saved.achievements.slice();
      return migrated;
    }

    function load() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (validCurrentSave(saved)) {
          state = saved;
        } else if (validLegacySave(saved)) {
          state = migrateLegacySave(saved);
          el('saveStatus').textContent = 'Äldre sparning omräknad till kronor.';
        } else {
          throw new Error('Invalid saved game data.');
        }
      } catch (error) {
        console.error('Could not load saved progress.', error);
        el('saveStatus').textContent = 'Sparningen kunde inte läsas. En ny butik startas.';
      }
    }

    function save() {
      try {
        state.version = SAVE_VERSION;
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
        storageAvailable = true;
        dirty = false;
        el('saveStatus').textContent = 'Sparat på den här apparaten • inga offlineintäkter.';
      } catch (error) {
        storageAvailable = false;
        console.error('Could not save clicker progress.', error);
        el('saveStatus').textContent = 'Sparning otillgänglig. Framsteg försvinner när sidan stängs.';
      }
    }

    function updateAchievements() {
      const purchased = state.upgrades.reduce((total, count) => total + count, 0);
      const unlocked = [
        state.earned >= 100,
        purchased >= 5,
        passiveIncome() > 0
      ];
      state.achievements = state.achievements.map((wasUnlocked, index) => wasUnlocked || unlocked[index]);
    }

    function buildShop() {
      const fragment = document.createDocumentFragment();
      upgrades.forEach((upgrade, index) => {
        const button = document.createElement('button');
        button.className = 'upgrade';
        button.type = 'button';
        button.dataset.upgradeIndex = String(index);

        const title = document.createElement('span');
        title.className = 'upgrade-title';
        const icon = document.createElement('span');
        icon.className = 'upgrade-icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = upgrade.icon;
        const name = document.createElement('strong');
        name.className = 'upgrade-name';
        name.textContent = upgrade.name;
        const count = document.createElement('small');
        count.className = 'upgrade-count';
        count.dataset.role = 'count';
        title.append(icon, name, count);

        const effect = document.createElement('span');
        effect.className = 'upgrade-effect';
        effect.dataset.role = 'effect';
        const price = document.createElement('span');
        price.className = 'upgrade-price';
        price.dataset.role = 'price';
        const details = document.createElement('span');
        details.className = 'upgrade-details';
        details.append(effect, price);

        button.append(title, details);
        fragment.append(button);
      });
      upgradeList.append(fragment);
    }

    function renderShop() {
      upgradeList.querySelectorAll('.upgrade').forEach(button => {
        const index = Number(button.dataset.upgradeIndex);
        const upgrade = upgrades[index];
        const price = upgradeCost(index);
        const unlocked = isUnlocked(index);
        const affordable = state.score >= price;
        const available = state.upgrades[index] < MAX_PURCHASES;
        const effect = upgrade.kind === 'click'
          ? `+${format(upgrade.effect)} kr/klick`
          : `+${format(upgrade.effect)} kr/s`;
        button.querySelector('[data-role="count"]').textContent = `×${format(state.upgrades[index])}`;
        button.querySelector('[data-role="effect"]').textContent = effect;
        button.querySelector('[data-role="price"]').textContent = `Pris: ${kronor(price)}`;
        button.classList.toggle('locked', !unlocked);
        button.classList.toggle('affordable', unlocked && affordable && available);
        button.disabled = !unlocked || !affordable || !available;
        button.setAttribute('aria-label', unlocked
          ? `${upgrade.icon} ${upgrade.name}, ${effect}, pris ${kronor(price)}, äger ${state.upgrades[index]}`
          : 'Låst uppgradering');
      });
    }

    function renderNetflix() {
      const panel = el('netflixPanel');
      const unlocked = netflixUnlocked();
      panel.hidden = !unlocked;
      if (!unlocked) return;

      const purchased = state.netflix;
      el('netflixPrice').textContent = `Pris: ${kronor(NETFLIX_COST)}`;
      el('netflixBuy').disabled = purchased || state.score < NETFLIX_COST;
      el('netflixBuy').textContent = purchased ? 'REDAN VÅRT' : state.score >= NETFLIX_COST ? 'KÖP NETFLIX' : 'EJ RÅD';
      el('netflixStatus').hidden = !purchased;
      el('netflixStatus').textContent = purchased ? 'UPPNÅTT • Netflix tillhör nu butiken.' : '';
      el('netflixDescription').textContent = purchased
        ? 'Abonnemanget ingår inte.'
        : 'Hela verksamheten. Kontant betalning.';
    }

    function render() {
      el('scoreValue').textContent = kronor(state.score);
      el('earnedValue').textContent = kronor(state.earned);
      el('rateValue').textContent = `+${format(passiveIncome())} kr/s`;
      el('clickValue').textContent = `${format(clickValue())} kr/klick`;
      coin.setAttribute('aria-label', `Tjäna ${kronor(clickValue())}`);
      const legacyNote = el('legacyIncomeNote');
      legacyNote.hidden = state.legacyIncome <= 0;
      legacyNote.textContent = state.legacyIncome > 0 ? `Äldre automatisk inkomst: +${format(state.legacyIncome)} kr/s` : '';
      renderShop();
      renderNetflix();
      achievementNames.forEach((name, index) => {
        const badge = el(`achievement${index + 1}`);
        badge.textContent = `${state.achievements[index] ? '✓' : 'LÅST'} • ${name}`;
        badge.classList.toggle('unlocked', state.achievements[index]);
      });
    }

    function changed() {
      updateAchievements();
      dirty = true;
      render();
    }

    function earn(amount) {
      if (!Number.isFinite(amount) || amount <= 0) return;
      const score = Math.min(LIMIT, state.score + amount);
      const earned = Math.min(LIMIT, state.earned + amount);
      if (score === state.score && earned === state.earned) return;
      state.score = score;
      state.earned = earned;
      changed();
    }

    function showClickFeedback(event, amount) {
      const rect = coinStage.getBoundingClientRect();
      const x = event.detail === 0 ? rect.width / 2 : event.clientX - rect.left;
      const y = event.detail === 0 ? rect.height / 2 : event.clientY - rect.top;
      const float = document.createElement('span');
      float.className = 'click-float';
      float.textContent = `+${format(amount)} kr`;
      float.style.left = `${Math.max(0, Math.min(rect.width, x))}px`;
      float.style.top = `${Math.max(0, Math.min(rect.height, y))}px`;
      el('clickEffects').append(float);
      float.addEventListener('animationend', () => float.remove(), { once: true });

      coin.style.setProperty('--coin-turn', `${(Math.random() * 10 - 5).toFixed(1)}deg`);
      coin.classList.remove('tapped');
      void coin.offsetWidth;
      coin.classList.add('tapped');
    }

    function buyUpgrade(index) {
      if (!Number.isInteger(index) || index < 0 || index >= upgrades.length) return;
      const price = upgradeCost(index);
      if (!isUnlocked(index) || state.score < price || state.upgrades[index] >= MAX_PURCHASES) return;
      state.score -= price;
      state.upgrades[index]++;
      changed();
      save();
    }

    function buyNetflix() {
      if (!netflixUnlocked() || state.netflix || state.score < NETFLIX_COST) return;
      state.score -= NETFLIX_COST;
      state.netflix = true;
      changed();
      save();
    }

    coin.addEventListener('click', event => {
      const amount = clickValue();
      earn(amount);
      showClickFeedback(event, amount);
    });

    upgradeList.addEventListener('click', event => {
      const button = event.target.closest('button[data-upgrade-index]');
      if (button) buyUpgrade(Number(button.dataset.upgradeIndex));
    });

    el('netflixBuy').addEventListener('click', buyNetflix);
    const resetButton = el('reset');
    let resetConfirmationTimer = null;
    resetButton.addEventListener('click', () => {
      if (resetButton.dataset.confirming !== 'true') {
        resetButton.dataset.confirming = 'true';
        resetButton.textContent = 'BEKRÄFTA?';
        resetButton.setAttribute('aria-label', 'Bekräfta nollställning');
        resetConfirmationTimer = setTimeout(() => {
          resetButton.dataset.confirming = 'false';
          resetButton.textContent = '↻';
          resetButton.setAttribute('aria-label', 'Nollställ spel');
        }, 5000);
        return;
      }

      clearTimeout(resetConfirmationTimer);
      resetButton.dataset.confirming = 'false';
      resetButton.textContent = '↻';
      resetButton.setAttribute('aria-label', 'Nollställ spel');
      state = defaults();
      changed();
      save();
    });

    buildShop();
    load();
    updateAchievements();
    render();
    save();

    let previous = performance.now();
    setInterval(() => {
      const now = performance.now();
      const elapsed = Math.min(2, (now - previous) / 1000);
      previous = now;
      const rate = passiveIncome();
      if (!document.hidden && rate > 0) earn(rate * elapsed);
      if (dirty) save();
    }, 1000);

    document.addEventListener('visibilitychange', () => {
      previous = performance.now();
      if (document.hidden) save();
    });
    window.addEventListener('pagehide', save);
  </script>
</body>
</html>
