<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d0b0a">
    <meta name="description" content="A Christmas video-rental shop advent calendar. Pick a case and enjoy a seasonal surprise.">
    <title>Adventa på nå gott — Christmas Video Store</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <h1 class="visually-hidden">Adventa på nå gott — Christmas Video Store</h1>
      <p class="open-count visually-hidden" id="open-count" aria-live="polite">0 of 24 opened</p>
      <p class="notice" id="notice" role="status" aria-live="polite" hidden></p>
      <section class="shelf-scene" aria-label="Christmas video-store rental shelves">
        <div class="shelf-cases" id="calendar-grid" role="group" aria-label="Select a rental case"></div>
      </section>
      <button class="reset-button utility-control" id="reset-calendar" type="button">Reset progress</button>
    </main>

    <section class="experience" id="experience" role="dialog" aria-modal="true" aria-labelledby="experience-title" aria-hidden="true" hidden>
      <h2 class="visually-hidden" id="experience-title">Selected rental</h2>
      <button class="experience-close" id="experience-close" type="button">Close</button>
      <p class="experience-status" id="experience-status" role="status" aria-live="polite"></p>

      <div class="case-animation" id="case-animation" aria-hidden="true">
        <img class="case-back" data-src="assets/tapes/case-back.png" alt="">
        <div class="case-front" id="case-front">
          <img id="case-cover" alt="">
        </div>
        <img class="case-media" id="case-media" alt="">
      </div>

      <div class="device-view" id="device-view" hidden>
        <h2 class="device-title" id="device-title"></h2>
        <div class="tv-stack" id="tv-stack" hidden>
          <div class="tv-set">
            <img class="tv-off" id="tv-off" data-src="assets/TV/tv-off.png" alt="">
            <div class="crt-screen" id="crt-screen">
              <video class="screen-video" id="screen-video" playsinline hidden></video>
              <img class="screen-image" id="screen-image" alt="" hidden>
            </div>
            <img class="tv-frame" id="tv-frame" data-src="assets/TV/tv-frame.png" alt="">
            <img class="tv-glass" id="tv-glass" data-src="assets/TV/tv-glass-overlay.png" alt="">
          </div>
          <img class="device-equipment" id="device-equipment" alt="">
        </div>

        <div class="radio-view" id="radio-view" hidden>
          <div class="radio-set" id="radio-set">
            <img class="radio-image" id="radio-image" data-idle-src="assets/TV/radio.png" data-playing-src="assets/TV/radio-on.png" alt="Stereo cassette player">
            <img class="radio-cassette" id="radio-cassette" data-src="assets/tapes/cassette.png" alt="">
          </div>
          <audio id="audio-player" preload="none"></audio>
          <audio id="static-audio" preload="none"></audio>
          <div class="audio-controls">
            <button class="play-pause" id="audio-toggle" type="button">Pause</button>
            <span id="audio-title"></span>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
